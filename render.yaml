services:
  - type: web
    name: creativedesk
    env: node
    region: singapore  # change to your nearest: oregon, frankfurt, singapore

    # Install ALL deps (including devDeps) then build both apps
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build && npx prisma generate

    # Run migrations + seed (first deploy), then start
    startCommand: |
      cd backend && npx prisma migrate deploy && node -e "const {execSync}=require('child_process');try{execSync('npx tsx prisma/seed.ts',{stdio:'inherit'})}catch(e){}" ; NODE_ENV=production node dist/index.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure secret
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: PORT
        value: 4002

    disk:
      name: creativedesk-data
      mountPath: /opt/render/project/src/backend/prisma
      sizeGB: 1
